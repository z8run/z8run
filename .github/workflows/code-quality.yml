name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication:
    name: Code Duplication Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Run duplication detection
        run: jscpd --config .jscpd.json .

      - name: Upload duplication report
        if: always() && hashFiles('.jscpd-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: .jscpd-report/
          retention-days: 30

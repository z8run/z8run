[package]
name = "z8run-cli"
description = "CLI for z8run - visual flow engine for workflow automation, AI pipelines, and IoT. Install with: cargo install z8run-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cli", "automation", "workflow", "flow-engine", "self-hosted"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "z8run"
path = "src/main.rs"

[dependencies]
z8run-core = { workspace = true }
z8run-api = { workspace = true }
z8run-storage = { workspace = true }
z8run-runtime = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
rand = { workspace = true }
